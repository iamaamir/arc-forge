name: Publish npm packages

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"
      - "*-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish workspace packages
        run: npm publish --workspaces --if-present --access public
