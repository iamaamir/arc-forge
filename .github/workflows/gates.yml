name: Gates

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Dependency-rule gate
        run: node packages/forge-gate/bin/forge-gate.mjs check --deps
